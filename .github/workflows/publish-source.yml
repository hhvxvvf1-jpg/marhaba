name: Publish and verify MARHABA

on:
  push:
    branches: [main]
    paths:
      - "MARHABA-deploy-clean.zip"
      - ".github/workflows/publish-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand the clean application archive
        shell: bash
        run: |
          set -euo pipefail

          archive="$GITHUB_WORKSPACE/MARHABA-deploy-clean.zip"
          test -s "$archive"

          temp_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$temp_dir"

          if [ -f "$temp_dir/package.json" ]; then
            app_dir="$temp_dir"
          else
            mapfile -t package_files < <(
              find "$temp_dir" -mindepth 2 -maxdepth 5 -type f -name package.json \
                ! -path "*/node_modules/*" ! -path "*/.next/*"
            )
            if [ "${#package_files[@]}" -ne 1 ]; then
              echo "Expected one application package.json in the archive; found ${#package_files[@]}."
              printf '%s\n' "${package_files[@]}"
              exit 1
            fi
            app_dir="$(dirname "${package_files[0]}")"
          fi

          test -s "$app_dir/package.json"
          test -s "$app_dir/package-lock.json"

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude=".env.local" \
            --exclude=".env.*.local" \
            --exclude="data/" \
            --exclude="node_modules/" \
            --exclude=".next/" \
            --exclude="coverage/" \
            --exclude="*.db" \
            --exclude="*.db-shm" \
            --exclude="*.db-wal" \
            --exclude=".session-secret" \
            "$app_dir/" "$GITHUB_WORKSPACE/"

          rm -f "$archive" \
            "$GITHUB_WORKSPACE/Publish-MARHABA.ps1" \
            "$GITHUB_WORKSPACE/Publish-MARHABA.bat" \
            "$GITHUB_WORKSPACE/00-START-HERE.txt"

          mkdir -p "$GITHUB_WORKSPACE/data"
          if ! grep -q '^tsconfig\.tsbuildinfo$' "$GITHUB_WORKSPACE/.gitignore"; then
            printf '\ntsconfig.tsbuildinfo\n' >> "$GITHUB_WORKSPACE/.gitignore"
          fi

      - name: Publish application source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish."
          else
            git commit -m "Publish MARHABA application source"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          MARHABA_SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm run build
