name: Publish and verify MARHABA

on:
  push:
    branches: [main]
    paths:
      - "MARHABA-deploy-clean.zip"
      - ".github/workflows/publish-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand and prepare the clean application archive
        shell: bash
        run: |
          set -euo pipefail

          archive="$GITHUB_WORKSPACE/MARHABA-deploy-clean.zip"
          test -s "$archive"

          temp_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$temp_dir"

          if [ -f "$temp_dir/package.json" ]; then
            app_dir="$temp_dir"
          else
            mapfile -t package_files < <(
              find "$temp_dir" -mindepth 2 -maxdepth 5 -type f -name package.json \
                ! -path "*/node_modules/*" ! -path "*/.next/*"
            )
            if [ "${#package_files[@]}" -ne 1 ]; then
              echo "Expected one application package.json in the archive; found ${#package_files[@]}."
              printf '%s\n' "${package_files[@]}"
              exit 1
            fi
            app_dir="$(dirname "${package_files[0]}")"
          fi

          test -s "$app_dir/package.json"
          test -s "$app_dir/package-lock.json"

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude=".env.local" \
            --exclude=".env.*.local" \
            --exclude="data/" \
            --exclude="node_modules/" \
            --exclude=".next/" \
            --exclude="coverage/" \
            --exclude="*.db" \
            --exclude="*.db-shm" \
            --exclude="*.db-wal" \
            --exclude=".session-secret" \
            --exclude="tsconfig.tsbuildinfo" \
            "$app_dir/" "$GITHUB_WORKSPACE/"

          rm -f "$archive" \
            "$GITHUB_WORKSPACE/Publish-MARHABA.ps1" \
            "$GITHUB_WORKSPACE/Publish-MARHABA.bat" \
            "$GITHUB_WORKSPACE/00-START-HERE.txt"

          # Make Next.js use Render's injected PORT while keeping local Docker on 3000.
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = "next start -H 0.0.0.0 -p ${PORT:-3000}";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          const dockerPath = "Dockerfile";
          if (fs.existsSync(dockerPath)) {
            let docker = fs.readFileSync(dockerPath, "utf8");
            docker = docker.replace("ENV PORT=3000", "ENV PORT=10000");
            docker = docker.replace(
              "http://127.0.0.1:3000/api/v1/health",
              "http://127.0.0.1:${PORT:-10000}/api/v1/health"
            );
            docker = docker.replace(
              'CMD ["npm", "run", "start"]',
              'CMD ["sh", "-c", "mkdir -p /app/data/uploads /app/data/backups /app/data/private-uploads && rm -rf /app/public/uploads/marhaba && ln -s /app/data/uploads /app/public/uploads/marhaba && rm -rf /app/backups && ln -s /app/data/backups /app/backups && exec npm run start"]'
            );
            fs.writeFileSync(dockerPath, docker);
          }

          // Keep local docker-compose usable on http://localhost:3000.
          const composePath = "docker-compose.yml";
          if (fs.existsSync(composePath)) {
            let compose = fs.readFileSync(composePath, "utf8");
            if (!compose.includes("PORT:")) {
              compose = compose.replace(
                "      NODE_ENV: production",
                '      NODE_ENV: production\n      PORT: "3000"\n      MARHABA_BACKUP_DIR: /app/data/backups'
              );
            }
            compose = compose.replace(/\n      - marhaba_uploads:\/app\/public\/uploads\/marhaba/g, "");
            compose = compose.replace(/\n      - \.\/backups:\/app\/backups/g, "");
            compose = compose.replace(/\n  marhaba_uploads:\n/g, "\n");
            fs.writeFileSync(composePath, compose);
          }

          fs.mkdirSync("data", { recursive: true });
          let ignore = fs.readFileSync(".gitignore", "utf8");
          if (!ignore.split(/\r?\n/).includes("tsconfig.tsbuildinfo")) {
            ignore += "\ntsconfig.tsbuildinfo\n";
          }
          fs.writeFileSync(".gitignore", ignore);
          NODE

      - name: Publish application source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish."
          else
            git commit -m "Publish MARHABA application source"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          MARHABA_SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm run build
